import = ["/home/coffee/.config/alacritty/themes/catppuccin_macchiato.toml"]
# import = ["/home/coffee/.config/alacritty/themes/catppuccin-latte.toml"]

[cursor]
blink_interval = 750
unfocused_hollow = true

[cursor.style]
blinking = "On"
shape = "Block"

[font]
size = 12.0

[font.bold]
family = "Hurmit Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "Hurmit Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "Hurmit Nerd Font Mono"
style = "Italic"

[font.normal]
family = "Hurmit Nerd Font Mono"
style = "Regular"

[scrolling]
history = 10000
multiplier = 3

[window]
decorations = "none"

[window.padding]
x = 10
y = 10
