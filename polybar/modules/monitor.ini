[module/memory]
type = internal/memory
interval = 2
format-prefix = %{T4} %{T-}
format-prefix-foreground = ${colors.peach}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = %{T5} %{T-}
format-prefix-foreground = ${colors.peach}
label = %percentage:2%%

[module/storage]
type = internal/fs
interval = 2
format-mounted-prefix = %{T4} %{T-}
format-mounted-prefix-foreground = ${colors.peach}
label-mounted = %percentage_used%%
