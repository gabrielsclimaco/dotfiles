[module/weather-status-icon]
type = custom/script
exec = ~/.config/scripts/wttr icon
interval = 1
format-foreground = ${colors.teal}
format-font=5
label = %output%

[module/weather-temp]
type = custom/script
exec = ~/.config/scripts/wttr temp
interval = 1
format-foreground = ${colors.text}
label = %output%

[module/weather-hum-icon]
type = custom/text
format = 
format-foreground = ${colors.teal}
format-font=8

[module/weather-hum]
type = custom/script
exec = ~/.config/scripts/wttr hum
interval = 1
format-foreground = ${colors.text}
label = %output%

[module/weather-wind-icon]
type = custom/text
format = 
format-foreground = ${colors.teal}
format-font=4

[module/weather-wind]
type = custom/script
exec = ~/.config/scripts/wttr wind
interval = 1
format-foreground = ${colors.text}
label = %output%
