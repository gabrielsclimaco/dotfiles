[module/backlight]
type = internal/backlight
use-actual-brightness = true
enable-scroll = true
format = %{T4}<ramp>%{T-} <label>
label = %percentage%%
ramp-foreground = ${colors.pink}

ramp-0 = 󰃞
ramp-1 = 󰃝
ramp-2 = 󰃟
ramp-3 = 󰃠

[module/battery]
type = internal/battery
full-at = 99
low-at = 20
battery = BAT1
adapter = ADP1
poll-interval = 5
format-charging = %{T4}<animation-charging>%{T-}<label-charging>
format-discharging = %{T4}<ramp-capacity>%{T-}<label-discharging>
format-full = %{T4}<ramp-capacity>%{T-}<label-full>
format-low = %{T4}<ramp-capacity>%{T-}<label-low>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%
ramp-capacity-foreground = ${colors.pink}
animation-charging-foreground = ${colors.pink}
animation-low-foreground = ${colors.red}

ramp-capacity-0 = " "
ramp-capacity-1 = " "
ramp-capacity-2 = " "
ramp-capacity-3 = " "
ramp-capacity-4 = " "

bar-capacity-width = 10

animation-charging-0 = " "
animation-charging-1 = " "
animation-charging-2 = " "
animation-charging-3 = " "
animation-charging-4 = " "
animation-charging-framerate = 750

animation-discharging-0 = " "
animation-discharging-1 = " "
animation-discharging-2 = " "
animation-discharging-3 = " "
animation-discharging-4 = " "

animation-discharging-framerate = 500

animation-low-0 = !
animation-low-1 =
animation-low-framerate = 200

[module/brightness]
type = custom/text
content = 
content-font = 2
content-foreground = ${colors.white}
content-margin = 0
click-left = "~/Scripts/Display/brightness_widget.sh"
