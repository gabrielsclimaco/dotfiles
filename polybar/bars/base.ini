[bar/base]
height = 24pt
radius = 4

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 4pt
border-color = #00000000

padding-left = 1
padding-right = 1

font-0 = "Hurmit Nerd Font Mono:weight=bold:size=10;2"
font-1 = "Hurmit Nerd Font Mono:weight=bold:size=12;2"
font-2 = "Hurmit Nerd Font Mono:weight=bold:size=16;2"
font-3 = "Symbols Nerd Font:size=12;2"
font-4 = "Symbols Nerd Font:size=14;2"
font-5 = "Symbols Nerd Font:size=16;2"
font-6 = "Symbols Nerd Font:size=18;2"
font-7 = "Symbols Nerd Font:size=20;2"

enable-ipc = true
cursor-click = pointer
override-redirect = true
